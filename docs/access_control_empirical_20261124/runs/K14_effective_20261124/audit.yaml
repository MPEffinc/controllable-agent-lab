version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  h2local:
    name: h2local
    endpoints:
      - host: 172.17.0.1
        port: 18083
        protocol: rest
        enforcement: audit
        rules:
          - allow:
              method: GET
              path: /ok
    binaries:
      - path: /bin/wget
